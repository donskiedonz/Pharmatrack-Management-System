<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Settings - PharmaTrack</title>

  <!-- Global Styles -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/settings.css" />
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar"></aside>
  <script>
    fetch('sidebar.html')
      .then(res => res.text())
      .then(html => document.getElementById('sidebar').innerHTML = html);
  </script>

  <!-- Main Content -->
  <div class="main-content">

    <header class="header">
  <div class="header-left">
    <h1>Account Settings</h1>
    <div id="liveDateTime"></div>
  </div>

  <div class="header-right">
    <div class="user-menu" id="userRoleDisplay"></div>

    <div class="menu-wrapper">
      <div class="profile-icon" id="menuToggle">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#4b7253" width="32" height="32">
          <path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.4c-3.3 0-9.9 1.7-9.9 5v2.5h19.8V19.4c0-3.3-6.6-5-9.9-5z"/>
        </svg>
      </div>

      <div class="menu-dropdown" id="menuDropdown">
        <a href="settings.html">Settings</a>
        <a href="profile.html">Profile</a>
        <a href="#" id="logoutBtn">Logout</a>
      </div>
    </div>
  </div>
</header>


    <!-- Settings Container -->
    <div class="settings-container">

      <!-- PROFILE SETTINGS -->
      <section class="settings-card">
        <h2>Profile Information</h2>

        <form id="profileForm" enctype="multipart/form-data">

          <div class="profile-image">
            <img id="profilePreview" src="/img/default-user.jpg" alt="Profile">

            <label for="profileImage" class="upload-btn">Change Photo</label>
            <input type="file" id="profileImage" accept="image/*" hidden>
          </div>

          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="fullName" required>
          </div>

          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" required>
          </div>

       <div class="form-group">
  <label>Role</label>
  <input type="text" id="role" readonly>
</div>


          <button type="submit" class="btn-primary">Save Profile</button>
        </form>
      </section>

      <!-- PASSWORD SETTINGS -->
      <section class="settings-card">
        <h2>Change Password</h2>

        <form id="passwordForm">
          <div class="form-group">
            <label>Current Password</label>
            <input type="password" id="currentPassword" required>
          </div>

          <div class="form-group">
            <label>New Password</label>
            <input type="password" id="newPassword" required>
          </div>

          <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" id="confirmPassword" required>
          </div>

          <button type="submit" class="btn-danger">Update Password</button>
        </form>
      </section>

      <p id="statusMsg" class="status-message"></p>

    </div>
  </div>

  <!-- Page Script -->
  <script src="js/settings.js"></script>
</body>
</html>
